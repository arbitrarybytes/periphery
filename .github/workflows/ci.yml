name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows runner: the app is Windows-first and the tray/pathing code
    # should be exercised on the platform it ships to.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
