[package]
name = "periphery"
# Kept in lockstep with package.json: one product, two shells. See
# ai-native/versioning.md. `tauri.conf.json` has no `version` key, so the
# bundle inherits this one.
version = "1.0.0-beta.1"
edition = "2024"

# The logic core lives in a library so it has a real public API surface (and so
# `cargo test` exercises it independently of the shell). The binary is a
# three-line entry point. `_lib` avoids colliding with the binary target name.
[lib]
name = "periphery_lib"
crate-type = ["lib"]

[dependencies]
axum = "0.8.9"
base64 = "0.23.0"
chrono = "0.4.45"
indexmap = { version = "2.14.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1.53.1", features = ["full"] }
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }

[build-dependencies]
tauri-build = "2.6.3"

[dev-dependencies]
http-body-util = "0.1.4"
tower = { version = "0.5.3", features = ["util"] }
