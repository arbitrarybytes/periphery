<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Periphery">
  <!-- Periphery brand mark: an orbit ring with a bright signal dot on its
       circumference — signal at the edge of attention. Mirrors the geometry
       used to generate assets/tray*.png. -->
  <defs>
    <mask id="gap">
      <rect width="100" height="100" fill="#fff"/>
      <!-- clearance around the dot so it reads as its own body -->
      <circle cx="71.2" cy="28.8" r="20" fill="#000"/>
    </mask>
  </defs>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#0067c0" stroke-width="15" mask="url(#gap)"/>
  <circle cx="71.2" cy="28.8" r="14" fill="#38c5ff"/>
</svg>
