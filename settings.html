<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>FlowState Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>

  <h1>FlowState Settings</h1>

  <div class="section">
    <div class="section-title">General Appearance</div>

    <div class="form-group row">
      <label for="verboseMode">Verbose Mode (Show Text &amp; Icons)</label>
      <label class="switch">
        <input type="checkbox" id="verboseMode">
        <span class="slider"></span>
      </label>
    </div>

    <div class="form-group row">
      <label for="glowRepeats">Glow Repeats (Pulse Count)</label>
      <input type="number" id="glowRepeats" min="1" max="10" step="1" class="narrow">
    </div>

    <div class="form-group row">
      <label>Preview a cue</label>
      <button type="button" id="testCueBtn" class="secondary">Send Test Cue</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Break Reminder</div>
    <div class="form-group row">
      <label for="pomodoroEnabled">Enable Break Reminder</label>
      <label class="switch">
        <input type="checkbox" id="pomodoroEnabled">
        <span class="slider"></span>
      </label>
    </div>
    <div class="form-group row">
      <label for="pomodoroMinutes">Remind Me Every (minutes)</label>
      <input type="number" id="pomodoroMinutes" min="1" max="240" step="1" class="narrow">
    </div>
  </div>

  <div class="section">
    <div class="section-title">GitLab Integration</div>
    <div class="form-group row">
      <label for="gitlabEnabled">Enable GitLab</label>
      <label class="switch">
        <input type="checkbox" id="gitlabEnabled">
        <span class="slider"></span>
      </label>
    </div>
    <div class="form-group">
      <label for="gitlabProjectId">Project ID</label>
      <input type="text" id="gitlabProjectId" placeholder="e.g. 12345678">
    </div>
    <div class="form-group">
      <label for="gitlabPat">Personal Access Token</label>
      <input type="password" id="gitlabPat" placeholder="Leave blank to keep existing token">
      <div class="secret-row">
        <span class="hint" id="gitlabPatStatus"></span>
        <button type="button" class="link" id="clearGitlabPat">Remove stored token</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Outlook Integration</div>
    <div class="form-group row">
      <label for="outlookEnabled">Enable Outlook</label>
      <label class="switch">
        <input type="checkbox" id="outlookEnabled">
        <span class="slider"></span>
      </label>
    </div>
    <div class="form-group">
      <label for="outlookEmail">User Email Address</label>
      <input type="text" id="outlookEmail" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="outlookToken">Microsoft Graph Token (For PoC)</label>
      <input type="password" id="outlookToken" placeholder="Leave blank to keep existing token">
      <div class="secret-row">
        <span class="hint" id="outlookTokenStatus"></span>
        <button type="button" class="link" id="clearOutlookToken">Remove stored token</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="hint" id="saveStatus" role="status"></span>
    <button type="button" id="saveBtn">Save Settings</button>
  </div>

  <script src="settings.js"></script>
</body>
</html>
