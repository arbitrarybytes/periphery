<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Periphery">
  <!-- Periphery concept mark: an orbit ring with a bright signal dot on its
       circumference — signal at the edge of attention.

       This is the *tray* mark, not the app icon. The app icon (build/logo.png)
       is a detailed neon glyph on a dark plate; at 16px that plate fills the
       tray slot and the glyph turns to mush. This shape stays legible at 16px,
       and carries the same violet-to-cyan gradient so the two read as one
       family. See scripts/build-assets.js. -->
  <defs>
    <linearGradient id="ring" x1="20" y1="80" x2="80" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38c5ff"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <mask id="gap">
      <rect width="100" height="100" fill="#fff"/>
      <!-- clearance around the dot so it reads as its own body -->
      <circle cx="71.2" cy="28.8" r="20" fill="#000"/>
    </mask>
  </defs>
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#ring)" stroke-width="15" mask="url(#gap)"/>
  <circle cx="71.2" cy="28.8" r="14" fill="#38c5ff"/>
</svg>
